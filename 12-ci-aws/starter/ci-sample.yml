# Sample — copy ideas into a real workflow; do not commit secrets.
name: sample-mailguard-ci
on:
  push:
    paths: ["07-mailguard-api/**"]
  pull_request:
    paths: ["07-mailguard-api/**"]
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r 07-mailguard-api/requirements.txt
      - run: pytest -q
        working-directory: 07-mailguard-api
