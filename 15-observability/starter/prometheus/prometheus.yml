global:
  scrape_interval: 5s

scrape_configs:
  # Why host.docker.internal:8000: compose publishes the app on the host; Prometheus
  # reaches it via the host-gateway mapping in otel-compose.yml (Linux + Desktop).
  - job_name: mailguard-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Optional: scrape the collector's Prometheus exporter when you send OTLP.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8889"]
