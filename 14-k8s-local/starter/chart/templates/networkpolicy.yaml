{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailguard-api.fullname" . }}-default-deny
  labels:
    {{- include "mailguard-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailguard-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mailguard-api.fullname" . }}-allow-dns-and-svc
  labels:
    {{- include "mailguard-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mailguard-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
