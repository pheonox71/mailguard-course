apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# commonLabels is deprecated (kustomize v5+); labels + includeSelectors
# preserves the old commonLabels behavior (metadata + selectors).
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: mailguard-api
      app.kubernetes.io/part-of: mailguard
