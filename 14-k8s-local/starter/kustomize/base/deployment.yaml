apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailguard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailguard-api
  template:
    metadata:
      labels:
        app: mailguard-api
    spec:
      containers:
        - name: api
          image: mailguard-api:local
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
