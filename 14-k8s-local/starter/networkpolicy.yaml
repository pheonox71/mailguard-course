# Default-deny for mailguard-api pods, then allow DNS egress + in-cluster Service traffic.
#
# kind note: kindnet did not enforce NetworkPolicy on older kind releases.
# Since kind **v0.24.0**, the default CNI bundles kube-network-policies and
# **does** enforce NetworkPolicy. On kind < 0.24, install Calico (or similar)
# or upgrade kind. Manifests teach the shape either way.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailguard-api-default-deny
spec:
  podSelector:
    matchLabels:
      app: mailguard-api
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailguard-api-allow-dns-and-svc
spec:
  podSelector:
    matchLabels:
      app: mailguard-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from other pods in the same namespace (Service → Pod).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS (kube-dns / CoreDNS) — required for most in-cluster name lookups.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
