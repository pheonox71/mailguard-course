# Runs Conftest + OPA against Module 16 fixtures/policies. Nested copy under
# 16-gitops-policy/.github/workflows/ is instructional only (GitHub ignores it).
name: Manifest policy check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest and OPA
        run: |
          set -euo pipefail
          CONFTEST_VER=0.71.1
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VER}/conftest_${CONFTEST_VER}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version
          OPA_VER=1.22.4
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VER}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
      - name: opa check (Rego v1 syntax)
        working-directory: 16-gitops-policy
        run: opa check policy/
      - name: opa test
        working-directory: 16-gitops-policy
        run: opa test policy/ -v
      - name: Good fixture must pass
        working-directory: 16-gitops-policy
        run: conftest test fixtures/good_deployment.yaml -p policy/
      - name: Bad fixture must fail
        working-directory: 16-gitops-policy
        run: |
          set -euo pipefail
          if conftest test fixtures/bad_deployment.yaml -p policy/; then
            echo "expected policy failure on bad_deployment.yaml" >&2
            exit 1
          fi
          echo "bad fixture correctly failed policy check"
