name: Course content CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the shipped tests are valid by applying solutions/ first.
  solutions-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 01-challenge-gym
          - dir: 02-mailguard-mfa
          - dir: 03-oidc-access
          - dir: 04-ztna-lite
          - dir: 05-email-auth
          - dir: 07-mailguard-api
          - dir: 10-secure-drop
          - dir: 11-security-notes
          - dir: 12-ci-aws
          - dir: 13-infra
          - dir: 14-k8s-local
          - dir: 15-observability
          - dir: 16-gitops-policy
          - dir: 19-capstone
          - dir: 20-scim-provisioning
          - dir: 21-global-privacy-collab
          - dir: 22-collab-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytest; fi
      - name: Copy solutions into katas and test
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ ! -d solutions ]; then
            echo "No solutions/ for ${{ matrix.dir }}" >&2
            exit 1
          fi
          mkdir -p katas
          find solutions -maxdepth 1 -type f ! -name 'README.md' -exec cp {} katas/ \;
          python3 -m pytest -q

  solutions-go-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Apply solution and test
        working-directory: 09-mailguard-worker
        run: |
          cp solutions/decision.go worker/decision.go
          cp solutions/sqs_contract.go worker/sqs_contract.go
          go test ./...

  solutions-go-totp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Apply solution and test
        working-directory: 01-challenge-gym/go-totp
        run: |
          cp ../solutions/totp.go totp.go
          go test ./...

  solutions-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phish Lite kata
        working-directory: 17-phish-lite
        run: |
          cp solutions/score.js katas/score.js
          npm test
      - name: Admin TypeScript kata
        working-directory: 08-mailguard-admin
        run: |
          cp solutions/rule_form.ts katas/rule_form.ts
          npm test

  # Runs tests against committed katas/ stubs. Reports per-module status and
  # always exits 0 so unfinished student work does not fail course CI.
  learner-katas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Learner kata status (non-gating)
        run: |
          chmod +x scripts/run_learner_katas.sh
          scripts/run_learner_katas.sh

  quiz-answer-key-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match quiz vs answer-key item counts
        run: python3 scripts/check_quiz_keys.py
