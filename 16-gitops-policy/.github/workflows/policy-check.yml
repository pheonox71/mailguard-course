# INSTRUCTIONAL SAMPLE ONLY — GitHub Actions does not run workflows nested under
# a module folder. The live gate is the repo-root workflow:
#   .github/workflows/policy-check.yml
# Copy this shape into a fork root if you are practicing outside this monorepo.
name: Manifest policy check (instructional sample)

on:
  pull_request:
  push:
    paths:
      - '16-gitops-policy/fixtures/**'
      - '16-gitops-policy/policy/**'

permissions:
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          set -euo pipefail
          VER=0.56.0
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${VER}/conftest_${VER}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version
      - name: Good fixture must pass
        working-directory: 16-gitops-policy
        run: conftest test fixtures/good_deployment.yaml -p policy/
      - name: Bad fixture must fail
        working-directory: 16-gitops-policy
        run: |
          set -euo pipefail
          if conftest test fixtures/bad_deployment.yaml -p policy/; then
            echo "expected policy failure on bad_deployment.yaml" >&2
            exit 1
          fi
