# ElasticMQ lab config — local SQS-compatible queues for MailGuard.
# Not a cloud account; no real credentials.

include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  mailguard-hold {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "mailguard-hold-dlq"
      maxReceiveCount = 3
    }
  }
  mailguard-hold-dlq {
  }
}
